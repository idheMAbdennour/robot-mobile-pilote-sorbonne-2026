// =========================================================================
// Script d'initialisation et de simulation Keil uVision
// Test du Capteur Inductif et des entrées ADC
// =========================================================================

// 1. Initialisation des entrées analogiques (ADC)
// Les VTREG AIN1, AIN2, AIN3 correspondent aux canaux AD0.1, AD0.2, AD0.3
// 1. Initialisation des entrées analogiques pour tester une distance de 230mm !
// D'après votre calibration : 
// - ADC1 (AV) à 230mm = 104.5 mV (0.1045 V)
// - ADC3 (HOR) à 230mm = env 33.0 mV (0.033 V, calculé par interpolation)
AIN1 = 0.1045; // AD0.1 (AV)
AIN2 = 0.1045; // AD0.2 (AR) - On suppose le robot parallèle au fil
AIN3 = 0.0330; // AD0.3 (HOR)

// Optionnel: On peut aussi fixer AIN0 (Proximètre)
AIN0 = 1.5;  // AD0.0 (PROX) ~ 1861 en 12 bits

// 2. Configuration des Switchs (HW mode = 111 par défaut)
// Configuration des Switchs : Mode 0b010 (SW3=0, SW2=1, SW1=0) -> Affiche la distance (X...mm)
PORT0 |= (1<<1);                   // SW2 à 1
PORT0 &= ~((1<<0) | (1<<6));       // SW1 et SW3 à 0

// 3. Fonction Signal pour simuler l'Enveloppe et la Clock
SIGNAL void capteur_inductif_sig(void) {
    int i;
    
    // Initialisation
    PORT0 &= ~(1<<28); // Enveloppe LOW
    PORT0 &= ~(1<<27); // Clock LOW
    
    while (1) {
        // --------------------------------------------------
        // NIVEAU BAS (Repos) : 0.5 ms
        // --------------------------------------------------
        PORT0 &= ~(1<<28); // Enveloppe LOW
        swatch(0.0005);    // Attendre 0.5 ms
        
        // --------------------------------------------------
        // NIVEAU HAUT (Salve) : 3.25 ms
        // --------------------------------------------------
        PORT0 |= (1<<28);  // Enveloppe HIGH
        
        // Pendant l'enveloppe, on génère une horloge (ex: 50 kHz, période 20 us)
        // 3.25 ms = 3250 us. Avec 20 us de période, on génère 162 impulsions.
        for (i = 0; i < 162; i++) {
            // Front descendant
            PORT0 &= ~(1<<27); // Clock LOW
            swatch(0.000010);  // 10 us
            
            // Front montant (Déclenchement de l'ADC)
            PORT0 |= (1<<27);  // Clock HIGH
            swatch(0.000010);  // 10 us
        }
        
        // Ajustement pour faire exactement 3.25 ms (162 * 20us = 3.24 ms)
        swatch(0.000010);
    }
}

// Lancement automatique du signal en arrière-plan
capteur_inductif_sig();
