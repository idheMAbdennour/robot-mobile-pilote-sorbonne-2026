// =========================================================================
// simu_all_debug.ini
// Test complet de l'asservissement avec tous les modes de debug activés
// =========================================================================

// ---------------------------------------------------------
// 1. Configuration de l'ID du robot (ex: Robot 1)
// ---------------------------------------------------------
PORT1 |=  (1<<18);
PORT1 &= ~((1<<19) | (1<<20) | (1<<21));

// ---------------------------------------------------------
// 2. Configuration des Switchs de Debug
// ---------------------------------------------------------
// Moteurs Debug : Activer P0.4 et P0.5
PORT0 |= (1<<4) | (1<<5);

// Capteur Inductif Debug : Activer SW2 (P0.1) et désactiver SW1 (P0.0), SW3 (P0.6)
PORT0 |= (1<<1);
PORT0 &= ~((1<<0) | (1<<6));

// Proximètre Debug : Activer P1.30 et P1.31
PORT1 |= (1<<30) | (1<<31);

// ---------------------------------------------------------
// 3. Configuration initiale des ADC (Position sur le fil)
// ---------------------------------------------------------
AIN1 = 1.4500; // AD0.1 (AV) centré sur le fil (1.45V = 0 distance)
AIN2 = 1.4500; // AD0.2 (AR) centré sur le fil
AIN3 = 0.0330; // AD0.3 (HOR) reste absolu (B_z vertical)
AIN0 = 1.5;    // AD0.0 (PROX)

// ---------------------------------------------------------
// 4. Signal de Simulation Globale (Trame + Clock + Mouvement)
// ---------------------------------------------------------
SIGNAL void simu_asservissement(void) {
    int i;
    int tick_count;
    int consigne_vitesse;
    
    tick_count = 0;
    consigne_vitesse = 0;
    
    // Initialisation
    PORT0 &= ~(1<<28); // Enveloppe LOW
    PORT0 &= ~(1<<27); // Clock LOW
    swatch(0.001); // Repos initial
    
    while (1) {
        if (tick_count >= 10) {
            // Alterner la vitesse et la position pour tester la réaction de l'asservissement
            if (consigne_vitesse == 0) {
                // Vitesse 40% Robot 1
                printf("\n--- Envoi Consigne : Vitesse 40%%, Robot decalé a GAUCHE ---\n");
                // Le capteur donne une tension signée centrée sur 1.45V
                // < 1.45V : décalage à GAUCHE (rapport négatif)
                AIN1 = 1.250; // AV < 1.45V
                AIN2 = 1.350; // AR < 1.45V
                
                // Entetes (E e) (clock ADC reduite pour accelerer la simulation)
                PORT0 |= (1<<28); for(i=0; i<8; i++) { PORT0 &= ~(1<<27); swatch(0.000010); PORT0 |= (1<<27); swatch(0.000010); } swatch(0.00325 - 0.00016); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); for(i=0; i<8; i++) { PORT0 &= ~(1<<27); swatch(0.000010); PORT0 |= (1<<27); swatch(0.000010); } swatch(0.00275 - 0.00016); PORT0 &= ~(1<<28); swatch(0.0005);
                
                // Type 000
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);

                // Robot 0001
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00175); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00225); PORT0 &= ~(1<<28); swatch(0.0005);

                // Valeur 0101000 (40)
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00175); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00225); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00175); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00225); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                
                consigne_vitesse = 1;
            } else {
                // Vitesse 60% Robot 1 (Valeur: 0111100 -> 60)
                // Séquence binaire : 0(0o) 1(1i) 1(1i) 1(1i) 1(1i) 0(0o) 0(0o)
                printf("\n--- Envoi Consigne : Vitesse 60%%, Robot decalé a DROITE ---\n");
                // > 1.45V : décalage à DROITE (rapport positif)
                AIN1 = 1.650; // AV > 1.45V
                AIN2 = 1.550; // AR > 1.45V
                
                // Entetes (E e) (clock ADC reduite pour accelerer la simulation)
                PORT0 |= (1<<28); for(i=0; i<8; i++) { PORT0 &= ~(1<<27); swatch(0.000010); PORT0 |= (1<<27); swatch(0.000010); } swatch(0.00325 - 0.00016); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); for(i=0; i<8; i++) { PORT0 &= ~(1<<27); swatch(0.000010); PORT0 |= (1<<27); swatch(0.000010); } swatch(0.00275 - 0.00016); PORT0 &= ~(1<<28); swatch(0.0005);
                
                // Type 000
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);

                // Robot 0001
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00175); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00225); PORT0 &= ~(1<<28); swatch(0.0005);

                // Valeur 0111100 (60)
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005); // 0 o
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00175); PORT0 &= ~(1<<28); swatch(0.0005); // 1 i
                PORT0 |= (1<<28); swatch(0.00225); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00175); PORT0 &= ~(1<<28); swatch(0.0005); // 1 i
                PORT0 |= (1<<28); swatch(0.00225); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00175); PORT0 &= ~(1<<28); swatch(0.0005); // 1 i
                PORT0 |= (1<<28); swatch(0.00225); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00175); PORT0 &= ~(1<<28); swatch(0.0005); // 1 i
                PORT0 |= (1<<28); swatch(0.00225); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005); // 0 o
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                PORT0 |= (1<<28); swatch(0.00075); PORT0 &= ~(1<<28); swatch(0.0005); // 0 o
                PORT0 |= (1<<28); swatch(0.00125); PORT0 &= ~(1<<28); swatch(0.0005);
                
                consigne_vitesse = 0;
            }
            tick_count = 0;
        } else {
            // Trafic de repos (E e) + Horloge de 3.25ms pour le capteur inductif
            PORT0 &= ~(1<<28); // Enveloppe LOW
            swatch(0.0005);    // Attendre 0.5 ms
            
            PORT0 |= (1<<28);  // Enveloppe HIGH (E)
            for (i = 0; i < 8; i++) { PORT0 &= ~(1<<27); swatch(0.000010); PORT0 |= (1<<27); swatch(0.000010); }
            swatch(0.00325 - 0.00016);
            
            PORT0 &= ~(1<<28); // Enveloppe LOW
            swatch(0.0005);
            
            PORT0 |= (1<<28);  // Enveloppe HIGH (e)
            for (i = 0; i < 8; i++) { PORT0 &= ~(1<<27); swatch(0.000010); PORT0 |= (1<<27); swatch(0.000010); }
            swatch(0.00275 - 0.00016);
            
            tick_count++;
        }
    }
}

// Lancement automatique du signal
simu_asservissement();
